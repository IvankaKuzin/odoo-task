version: '3.8'
services:
  odoo:
    image: odoo:16
    container_name: odoo16
    depends_on:
      - postgres
    ports:
      - "8069:8069"
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
    restart: unless-stopped

  postgres:
    image: postgres:14
    container_name: postgres-odoo
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo_data:
  pg_data:
